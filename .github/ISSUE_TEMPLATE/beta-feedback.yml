name: Beta feedback / Beta-Rückmeldung
description: Report a problem or suggest an improvement / Fehler oder Idee melden
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Sprachnotiz! / Danke fürs Testen!
        This report is public. Do not include audio files, transcripts, private filenames, personal information, or diagnostic logs.
        Dieser Beitrag ist öffentlich. Bitte keine Audios, Transkripte, privaten Dateinamen, persönlichen Daten oder Diagnoseprotokolle einfügen.
  - type: dropdown
    id: category
    attributes:
      label: Category / Bereich
      options:
        - Installation / First launch
        - Audio folder / Detection
        - Transcription
        - Summary
        - Glass card / Settings
        - Beta activation / Updates
        - Suggestion / Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version / App-Version
      placeholder: "e.g. 0.8.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version / macOS-Version
      placeholder: "e.g. macOS 26.1, Apple M2"
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What happened or what would you improve? / Was ist passiert oder was fehlt?
      description: Explain the steps, expected result and actual result. Use a made-up example if needed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report / Öffentlicher Beitrag
      options:
        - label: I have not included private audio, transcripts or personal information. / Keine privaten Audios, Transkripte oder persönlichen Daten enthalten.
          required: true
